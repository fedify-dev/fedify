name = "fedify-test"
main = "src/cfworkers/server.ts"
compatibility_date = "2025-05-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "tsdown --platform=neutral --out-dir=src/cfworkers/dist/ && deno run --allow-read scripts/discover_tests.ts > src/cfworkers/imports.ts"

# Test-only DNS: production validation still checks the returned IP addresses.
[alias]
"node:dns/promises" = "./src/cfworkers/dns.ts"
