# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Main CI workflow for testing, linting, and publishing to JSR/npm.
# npm publishing is handled by build.yaml, which is triggered via workflow_dispatch
# from the publish-npm job. This allows npm publishing to run in parallel with
# docs publishing, rather than waiting for the entire workflow to complete.
# See build.yaml for details on why this separation is required for npm's
# trusted publishing (OIDC).
name: main
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
    - uses: jdx/mise-action@v4
      with:
        version: 2026.11.6
        install: false
        cache: false
    # Provision only the harness runtime before checking the fresh checkout.
    # The harness then runs mise install with its normal postinstall hook.
    - run: mise --no-hooks exec --no-deps node -- node scripts/test_bootstrap.mjs
    - run: mise run test:tooling:no-deno
    - name: Check repeated formatter worker teardown on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        for ($attempt = 1; $attempt -le 100; $attempt++) {
          Write-Host "Formatter process $attempt/100"
          mise exec -- node --experimental-transform-types --test scripts/formatting.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

  test-deno:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    services:
      rabbitmq:
        image: rabbitmq
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
        - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      redis:
        image: redis:7.2.17
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 6379:6379
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: fedify
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 3306:3306
    env:
      AMQP_URL: amqp://guest:guest@localhost:5672
      MYSQL_URL: mysql://root:mysql@localhost:3306/fedify
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - name: Enable RabbitMQ consistent hash exchange plugin
      run: docker exec ${{ job.services.rabbitmq.id }} rabbitmq-plugins enable rabbitmq_consistent_hash_exchange
    # setup-mise installs dependencies, generates vocabulary and builds packages.
    # --skip-deps omits task dependencies, so prepare and validate Deno here.
    - run: mise run deno:cache
    - run: mise run codegen:check:deno
    - run: mise run --skip-deps check:types:deno
    - run: mise run --skip-deps test:deno -- --coverage=.cov --junit-path=.test-report.xml
      env:
        RUST_BACKTRACE: ${{ runner.debug }}
        LOG: ${{ runner.debug && 'always' || '' }}
        AMQP_ORDERING_TEST: "true"
    - uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: "Test Results (${{ matrix.os }})"
        path: .test-report.xml
        reporter: jest-junit
      continue-on-error: true
    - if: '!cancelled()'
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: .test-report.xml
        report_type: test_results
      continue-on-error: true
    - run: deno coverage --lcov .cov > .cov.lcov
      continue-on-error: true
    - uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: .cov.lcov
      continue-on-error: true

  test-node:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
        - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      redis:
        image: redis:7.2.17
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 6379:6379
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: fedify
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 3306:3306
    env:
      MISE_DISABLE_TOOLS: deno
      AMQP_URL: amqp://guest:guest@localhost:5672
      MYSQL_URL: mysql://root:mysql@localhost:3306/fedify
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - name: Enable RabbitMQ consistent hash exchange plugin
      run: docker exec ${{ job.services.rabbitmq.id }} rabbitmq-plugins enable rabbitmq_consistent_hash_exchange
    - run: mise run test:tooling:no-deno -- --default-test
      env:
        AMQP_ORDERING_TEST: "true"

  test-bun:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
        - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      redis:
        image: redis:7.2.17
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 6379:6379
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: fedify
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 3306:3306
    env:
      MISE_DISABLE_TOOLS: deno
      AMQP_URL: amqp://guest:guest@localhost:5672
      MYSQL_URL: mysql://root:mysql@localhost:3306/fedify
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - name: Enable RabbitMQ consistent hash exchange plugin
      run: docker exec ${{ job.services.rabbitmq.id }} rabbitmq-plugins enable rabbitmq_consistent_hash_exchange
    - run: mise run --skip-deps test:bun
      env:
        AMQP_ORDERING_TEST: "true"

  test-mariadb-kv:
    name: MariaDB KV (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: mariadb
          MARIADB_DATABASE: fedify
        ports:
        - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MISE_DISABLE_TOOLS: ${{ matrix.runtime != 'deno' && 'deno' || '' }}
      MYSQL_URL: mysql://root:mariadb@127.0.0.1:3306/fedify
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - name: Test MariaDB KV on Node.js
      if: matrix.runtime == 'node'
      run: mise exec -- node --experimental-transform-types --test packages/mysql/src/kv.test.ts packages/mysql/src/atomic-kv.test.ts
    - name: Test MariaDB KV on Bun
      if: matrix.runtime == 'bun'
      run: mise exec -- bun test --timeout=60000 packages/mysql/src/kv.test.ts packages/mysql/src/atomic-kv.test.ts
    - name: Prepare Deno workspace imports
      if: matrix.runtime == 'deno'
      run: mise run deno:cache
    - name: Test MariaDB KV on Deno
      if: matrix.runtime == 'deno'
      run: mise run --skip-deps test:deno packages/mysql/src/kv.test.ts packages/mysql/src/atomic-kv.test.ts

  test-redis-atomic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["7.2.17", "7.4.12", "8.10.3"]
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis-admin:
        image: redis:${{ matrix.redis }}
        ports:
        - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      FEDIFY_REDIS_REQUIRE_ATOMIC_TESTS: "true"
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_ATOMIC_ADMIN_URL: redis://127.0.0.1:6380
      REDIS_CLUSTER_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
      REDIS_ATOMIC_CLUSTER_ADMIN_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
      REDIS_ATOMIC_MIGRATION_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - name: Start a dedicated three-primary Redis Cluster
      env:
        REDIS_IMAGE: redis:${{ matrix.redis }}
      run: |
        for port in 7000 7001 7002; do
          docker run --detach --name "redis-cluster-$port" --network host \
            "$REDIS_IMAGE" redis-server --bind 127.0.0.1 --port "$port" \
            --cluster-enabled yes --cluster-config-file /data/nodes.conf \
            --cluster-announce-ip 127.0.0.1 --save "" --appendonly no
          for _ in $(seq 1 30); do
            if docker exec "redis-cluster-$port" redis-cli -p "$port" ping | grep -q PONG; then
              break
            fi
            sleep 1
          done
          docker exec "redis-cluster-$port" redis-cli -p "$port" ping | grep -q PONG
        done
        docker exec redis-cluster-7000 redis-cli --cluster create \
          127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
          --cluster-replicas 0 --cluster-yes
        for port in 7000 7001 7002; do
          for _ in $(seq 1 30); do
            if docker exec "redis-cluster-$port" redis-cli -p "$port" cluster info | grep -q 'cluster_state:ok'; then
              break
            fi
            sleep 1
          done
          docker exec "redis-cluster-$port" redis-cli -p "$port" cluster info | grep -q 'cluster_state:ok'
        done
    # The task runs Deno, Node.js and Bun sequentially on exclusive fixtures.
    - run: mise run test-each redis

  test-cfworkers:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - run: mise run test:tooling:no-deno -- --workers

  test-temporal-polyfill:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - run: mise run --skip-deps test:temporal-polyfill

  lint:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
      with:
        # '0' as a string: the number 0 is falsy in expressions
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    - uses: ./.github/actions/setup-mise
    - run: mise run check
    - if: github.event_name == 'pull_request' && github.repository == 'fedify-dev/fedify'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: >-
        mise run --skip-deps check:changelog-pr-refs --
        --pr "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA"

  release-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - run: '[[ "$(jq -r .version deno.json)" = "$(jq -r .version package.json)" ]]'
      working-directory: ${{ github.workspace }}/packages/fedify/
    - run: mise run test:package-files:npm
    - run: pnpm publish --recursive --dry-run --no-git-checks --ignore-scripts

  release-test-jsr:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - run: mise run codegen
    - run: deno publish --dry-run --allow-slow-types
    - run: mise run test:package-files:jsr

  # ===========================================================================
  # PR-only jobs: Validate CLI and docs build
  # ===========================================================================

  build-cli-pr:
    if: github.event_name == 'pull_request'
    needs: [release-test, release-test-jsr]
    runs-on: namespace-profile-linux-amd64-32gb
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - run: mise run codegen
    - run: deno task pack
      working-directory: ${{ github.workspace }}/packages/cli/
      env:
        CONCURRENCY: "5"
    - uses: actions/upload-artifact@v7
      with:
        name: cli-pr-${{ github.event.pull_request.number }}
        path: |
          packages/cli/fedify-cli-*.tar.xz
          packages/cli/fedify-cli-*.zip

  build-docs-pr:
    if: github.event_name == 'pull_request'
    needs: [release-test]
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - uses: ./.github/actions/cache-docs
    - run: pnpm run build
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: ${{ github.workspace }}/docs/
    - uses: actions/upload-artifact@v7
      with:
        name: docs-pr-${{ github.event.pull_request.number }}
        path: docs/.vitepress/dist

  # ===========================================================================
  # Push-only jobs: Determine version
  # ===========================================================================

  determine-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_version: ${{ steps.version.outputs.short_version }}
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - id: version
      uses: ./.github/actions/determine-version
    - if: github.ref_type == 'tag'
      run: |
        set -ex
        [[ "$(jq -r .version deno.json)" = "$GITHUB_REF_NAME" ]]
        ! grep -i "to be released" CHANGES.md
      working-directory: ${{ github.workspace }}/packages/fedify/

  # ===========================================================================
  # Push-only jobs: Build artifacts (run in parallel after version determined)
  # ===========================================================================

  build-cli:
    if: github.event_name == 'push'
    needs: [bootstrap, test-deno, test-node, test-bun, test-mariadb-kv, test-redis-atomic, test-cfworkers, test-temporal-polyfill, lint, release-test, release-test-jsr, determine-version]
    runs-on: namespace-profile-linux-amd64-32gb
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - uses: ./.github/actions/determine-version
    - run: mise run codegen
    - run: deno task pack
      working-directory: ${{ github.workspace }}/packages/cli/
      env:
        CONCURRENCY: "5"
    - uses: actions/upload-artifact@v7
      with:
        name: cli
        path: |
          packages/cli/fedify-cli-*.tar.xz
          packages/cli/fedify-cli-*.zip

  build-packages:
    if: github.event_name == 'push'
    needs: [bootstrap, test-deno, test-node, test-bun, test-mariadb-kv, test-redis-atomic, test-cfworkers, test-temporal-polyfill, lint, release-test, release-test-jsr, determine-version]
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: deno
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - uses: ./.github/actions/determine-version
    - run: sudo npm install -g npm@latest && npm --version
    - run: pnpm -r --filter='!./examples/**' run build:self
    - run: |
        pnpm pack --recursive --workspace-concurrency=1 --filter='!./examples/**' --config.enable-pre-post-scripts=true
        # Remove private packages
        for pkg in fedify-*.tgz; do
          if tar -xOzf "$pkg" package/package.json | jq -e '.private == true' > /dev/null 2>&1; then
            echo "Removing private package: $pkg"
            rm "$pkg"
          fi
        done
    - uses: actions/upload-artifact@v7
      with:
        name: npm-packages
        path: fedify-*.tgz

  publish-jsr:
    if: github.event_name == 'push'
    needs: [bootstrap, test-deno, test-node, test-bun, test-mariadb-kv, test-redis-atomic, test-cfworkers, test-temporal-polyfill, lint, release-test, release-test-jsr, determine-version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - uses: ./.github/actions/determine-version
    - run: |
        set -ex
        mise run codegen
        max_attempts=30
        publish_timeout=60s
        retry_delay=30s
        attempt=1
        until timeout "$publish_timeout" deno publish --allow-dirty --allow-slow-types; do
          exit_code=$?
          if [[ $attempt -ge $max_attempts ]]; then
            echo "deno publish failed after $max_attempts attempts"
            exit $exit_code
          fi
          echo "deno publish failed or timed out (attempt $attempt/$max_attempts), retrying in $retry_delay..."
          sleep "$retry_delay"
          ((attempt++))
        done

  # ===========================================================================
  # Push-only jobs: Create GitHub release (tag only)
  # ===========================================================================

  create-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build-cli, build-packages, publish-jsr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: cli
        path: cli-artifacts/
    - uses: actions/download-artifact@v8
      with:
        name: npm-packages
        path: npm-artifacts/
    - id: extract-changelog
      uses: dahlia/submark@5a5ff0a58382fb812616a5801402f5aef00f90ce
      with:
        input-file: CHANGES.md
        heading-level: 2
        heading-title-text: version ${{ github.ref_name }}
        ignore-case: true
        omit-heading: true
    - run: 'cat "$CHANGES_FILE"'
      env:
        CHANGES_FILE: ${{ steps.extract-changelog.outputs.output-file }}
    - uses: softprops/action-gh-release@v3
      with:
        body_path: ${{ steps.extract-changelog.outputs.output-file }}
        name: Fedify ${{ github.ref_name }}
        files: |
          npm-artifacts/fedify-*.tgz
          cli-artifacts/fedify-cli-*.tar.xz
          cli-artifacts/fedify-cli-*.zip
        generate_release_notes: false

  # ===========================================================================
  # Push-only jobs: Publish to npm and docs
  # ===========================================================================

  # Trigger build.yaml via workflow_dispatch to publish to npm.
  # This is required because npm's trusted publishing (OIDC) validates
  # the directly triggered workflow, not reusable workflows called via
  # workflow_call. By triggering build.yaml directly, npm sees build.yaml
  # as the entry point and validates against it.
  publish-npm:
    if: github.event_name == 'push'
    needs: [build-packages]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Trigger build.yaml workflow
      uses: actions/github-script@v9
      with:
        script: |
          // Determine tag based on ref type
          let tag;
          if (context.payload.ref && context.payload.ref.startsWith('refs/tags/')) {
            tag = 'latest';
          } else {
            tag = 'dev';
          }

          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'build.yaml',
            ref: context.ref,
            inputs: {
              run_id: '${{ github.run_id }}',
              tag: tag
            }
          });
          console.log(`Triggered build.yaml workflow with run_id=${{ github.run_id }}, tag=${tag}`);

  publish-docs:
    if: github.event_name == 'push'
    needs: [publish-jsr, determine-version]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
      deployments: write
      statuses: write
    env:
      MISE_DISABLE_TOOLS: deno
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-mise
    - uses: ./.github/actions/cache-docs
    - run: |
        set -ex
        if [[ "$GITHUB_REF_TYPE" = "tag" ]]; then
          EXTRA_NAV_TEXT=Unstable \
          EXTRA_NAV_LINK="$UNSTABLE_DOCS_URL" \
          SITEMAP_HOSTNAME="$STABLE_DOCS_URL" \
          JSR_REF_VERSION=stable \
          pnpm run build
        else
          EXTRA_NAV_TEXT=Stable \
          EXTRA_NAV_LINK="$STABLE_DOCS_URL" \
          SITEMAP_HOSTNAME="$UNSTABLE_DOCS_URL" \
          JSR_REF_VERSION=unstable \
          pnpm run build
        fi
      env:
        SHORT_VERSION: ${{ needs.determine-version.outputs.short_version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
        STABLE_DOCS_URL: ${{ vars.STABLE_DOCS_URL }}
        UNSTABLE_DOCS_URL: ${{ vars.UNSTABLE_DOCS_URL }}
      working-directory: ${{ github.workspace }}/docs/
    - uses: actions/upload-pages-artifact@v5
      with:
        path: docs/.vitepress/dist
    - id: deployment
      if: github.ref_type == 'tag'
      uses: actions/deploy-pages@v5
    - if: github.ref == 'refs/heads/main'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        gitHubToken: ${{ github.token }}
        command: >-
          pages deploy .vitepress/dist
          --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
        packageManager: pnpm
        workingDirectory: ${{ github.workspace }}/docs/

