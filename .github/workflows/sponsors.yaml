name: sponsors
on:
  schedule:
  - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update-sponsors:
    ## Only run on the upstream repository.
    if: github.repository == 'fedify-dev/fedify'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
      with:
        ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
        persist-credentials: true
        fetch-depth: 0
    - uses: ./.github/actions/setup-mise
    - uses: qoomon/actions--setup-git@v1
    - run: |
        set -e
        node --experimental-strip-types --experimental-permission \
          --allow-fs-read=scripts \
          --allow-fs-read=packages/fedify/README.md --allow-fs-read=SPONSORS.md \
          --allow-fs-write=packages/fedify/README.md --allow-fs-write=SPONSORS.md \
          scripts/sponsors.ts \
          packages/fedify/README.md \
          SPONSORS.md
        hongdown --write packages/fedify/README.md SPONSORS.md
        cat SPONSORS.md
        if ! git diff-index --quiet HEAD --; then
          git add packages/fedify/README.md SPONSORS.md
          git commit -m "Update sponsors" || true
        fi
    - uses: ad-m/github-push-action@master
      with:
        ssh: true
        branch: main

# cSpell: ignore qoomon opencollective
